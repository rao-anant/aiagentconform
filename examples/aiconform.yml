# Copy to .github/workflows/aiconform.yml after the v0.3.0 release is complete.
name: AIAgentConform conformance
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # v0.3.0 is promised never to move. A reviewed full commit SHA is the
      # strongest security pin because Git tags are technically mutable.
      - uses: rao-anant/aiagentconform@v0.3.0
        with:
          path: ./plugin
